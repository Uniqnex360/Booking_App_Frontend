workflows:
  ios-capacitor:
    name: iOS App Store Release - Vybhz
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - ENV
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vyhbz.app
      vars:
        BUNDLE_ID: "com.vyhbz.app"
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: 26.4
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Force Update iOS Deployment Target
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Apply Provisioning Profiles
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build IPA binary
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" || {
              echo "=== XCODEBUILD ERROR LOGS ==="
              for logfile in /tmp/xcodebuild_logs/*.log; do
                if [ -f "$logfile" ]; then
                  echo "--- $logfile ---"
                  tail -n 80 "$logfile"
                fi
              done
              exit 1
            }

      - name: Upload to App Store Connect
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8
          xcrun altool --upload-package build/ios/ipa/App.ipa \
            --type ios \
            --apple-id 6821933527 \
            --bundle-id com.vyhbz.app \
            --bundle-version $BUILD_NUMBER \
            --bundle-short-version-string 1.0 \
            --apiKey $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log